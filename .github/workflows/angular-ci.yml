name: Angular CI/CD - Hostinger

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: Detect Angular output directory
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -f dist/fingerprint-attendance/browser/index.html ]; then
            echo "ANGULAR_OUTPUT=dist/fingerprint-attendance/browser/" >> "$GITHUB_ENV"
          elif [ -f dist/fingerprint-attendance/index.html ]; then
            echo "ANGULAR_OUTPUT=dist/fingerprint-attendance/" >> "$GITHUB_ENV"
          else
            echo "Angular output not found. Check angular.json and dist/ contents."
            find dist -maxdepth 4 -name index.html -print
            exit 1
          fi

      - name: Deploy to Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ${{ env.ANGULAR_OUTPUT }}
          server-dir: /public_html/
